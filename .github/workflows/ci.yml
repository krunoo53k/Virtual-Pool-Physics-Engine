name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build every target
        run: cargo build --workspace --all-targets

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@nextest
      - name: Run unit and integration tests
        run: cargo nextest run --workspace --profile ci
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Publish test results
        # A fork's token is read-only, so it cannot create the results check.
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/nextest/ci/junit.xml
          check_name: Test results
          check_run_annotations: none
          comment_mode: off
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    outputs:
      warnings: ${{ steps.lint.outputs.warning_count }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Lint and report diagnostics
        id: lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=json \
            | python3 .github/scripts/clippy-annotations.py

  demos:
    name: Demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Check that the demos match the core
        run: |
          cargo run -p pool-visual -- demos
          git diff -- demos/
          if [ -n "$(git status --porcelain -- demos/)" ]; then
            echo "The demos are out of date."
            echo "Run 'cargo run -p pool-visual -- demos' and commit the result."
            exit 1
          fi

  corpus:
    name: Corpus (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: x86_64
          - mode: aarch64
          - mode: wasm32-wasip1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install cross for aarch64
        if: matrix.mode == 'aarch64'
        uses: taiki-e/install-action@cross
      - name: Add the WASI target
        if: matrix.mode == 'wasm32-wasip1'
        run: rustup target add wasm32-wasip1
      - name: Replay the corpus on x86_64
        if: matrix.mode == 'x86_64'
        run: cargo test -p pool-intent --test corpus
      - name: Replay the corpus on aarch64
        if: matrix.mode == 'aarch64'
        run: cross test -p pool-intent --test corpus --target aarch64-unknown-linux-gnu
      - name: Replay the corpus on wasm32-wasip1
        if: matrix.mode == 'wasm32-wasip1'
        run: cargo test -p pool-intent --test corpus --target wasm32-wasip1

  corpus_compile:
    name: Corpus compile (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Add the bare wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Compile the pure-Rust crates and their tests
        run: >-
          cargo test -p pool-core -p pool-intent -p pool-rules
          --target wasm32-unknown-unknown --no-run

  compat_guard:
    name: Corpus / model-version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Corpus hashes and model version must move together
        run: python3 .github/scripts/check_corpus_guard.py
      - name: The canary in compat.json must match the built helper
        run: |
          actual=$(cargo run -q -p pool-intent --example canary | awk '/^canary /{print $2}')
          expected=$(python3 -c 'import json; print(json.load(open("compat.json"))["canary"])')
          echo "canary: built=$actual manifest=$expected"
          test "$actual" = "$expected"

  summary:
    name: Summary
    if: always()
    needs: [format, build, tests, clippy, demos, corpus, corpus_compile, compat_guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download JUnit report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: junit
          path: test-results
      - name: Write the overview
        env:
          FMT_RESULT: ${{ needs.format.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          DEMOS_RESULT: ${{ needs.demos.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          CORPUS_COMPILE_RESULT: ${{ needs.corpus_compile.result }}
          COMPAT_GUARD_RESULT: ${{ needs.compat_guard.result }}
          CLIPPY_WARNINGS: ${{ needs.clippy.outputs.warnings }}
        run: python3 .github/scripts/summary.py test-results/junit.xml
