name: Set up Rust
description: Install stable Rust and restore the Cargo cache. Check out the repository first.

inputs:
  components:
    description: Comma-separated rustup components to install in addition to the toolchain.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Cache Cargo artifacts
      uses: Swatinem/rust-cache@v2
