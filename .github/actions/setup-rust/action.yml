name: Set up Rust
description: Check out the repository, install stable Rust and restore the Cargo cache.

inputs:
  components:
    description: Comma-separated rustup components to install in addition to the toolchain.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Cache Cargo artifacts
      uses: Swatinem/rust-cache@v2
