[workspace]
resolver = "2"
members = [
    "pool-core",
    "pool-intent",
    "pool-rules",
    "pool-cli",
    "pool-visual",
    "pool-godot",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/krunoo53k/Virtual-Pool-Physics-Engine"
homepage = "https://github.com/krunoo53k/Virtual-Pool-Physics-Engine"
documentation = "https://docs.rs/pool-core"

[workspace.dependencies]
libm = "0.2"

[profile.release]
# Keep the floating point flags uniform across every target (§11.4 risk 7):
# no FMA contraction, no fast-math.
opt-level = 3
debug = false
overflow-checks = false
