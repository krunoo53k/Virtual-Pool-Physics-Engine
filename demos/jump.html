<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Pool &mdash; physics viewer</title>
<style>
  :root {
    --bg:#0f1319; --panel:#181e26; --panel2:#1e252f; --line:#2a3340;
    --text:#e7edf4; --dim:#8a97a5; --accent:#4ea1ff; --felt:#1d6b4b;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 320px; grid-template-rows:auto minmax(0,1fr) auto;
         gap:12px; padding:12px; height:100vh; }
  header { grid-column:1/3; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; letter-spacing:.4px; font-weight:600; }
  header .sub { color:var(--dim); font-size:11px; }
  header .tag { margin-left:auto; font-size:10px; padding:2px 9px; border:1px solid var(--line);
               border-radius:999px; color:var(--dim); }
  .stage { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:10px; display:flex; flex-direction:column; gap:8px; min-height:0; }
  .canvas-wrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas#table { max-width:100%; max-height:100%; border-radius:4px; }
  .transport { display:flex; gap:12px; align-items:center; }
  .transport .scrub { flex:1; position:relative; height:24px; display:flex; align-items:center; }
  .transport input[type=range] { width:100%; accent-color:var(--accent); position:relative; z-index:2; }
  .ticks { position:absolute; inset:0; pointer-events:none; }
  .tick { position:absolute; bottom:1px; width:2px; height:7px; border-radius:1px; opacity:.85; }
  button, select {
    background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:5px;
    padding:5px 10px; cursor:pointer; font:inherit; font-size:12px;
  }
  button:hover, select:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#06101c; border-color:var(--accent); }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;
          overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .grp { border:1px solid var(--line); border-radius:6px; padding:9px; }
  .grp h2 { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
            margin:0 0 8px; font-weight:600; }
  .shots { display:flex; flex-direction:column; gap:5px; }
  .shots button { text-align:left; }
  .shots button small { display:block; color:var(--dim); font-size:10px; }
  .shots button.on small { color:#0b2338; }
  .toggles { display:flex; flex-wrap:wrap; gap:6px; }
  .read { display:flex; justify-content:space-between; font-size:11px; padding:2px 0;
          border-bottom:1px dotted #253040; gap:8px; }
  .read b { font-weight:600; text-align:right; }
  table.balls { width:100%; border-collapse:collapse; font-size:11px; }
  table.balls th { text-align:left; color:var(--dim); font-weight:600; padding:1px 0; font-size:10px; }
  table.balls td { padding:1px 0; }
  table.balls td.n { text-align:right; }
  .swatch { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;
            vertical-align:middle; border:1px solid rgba(255,255,255,.25); }
  .evlog { max-height:220px; overflow:auto; font-size:11px; }
  .ev { display:flex; gap:7px; padding:2px 0; color:var(--dim); cursor:pointer; }
  .ev:hover { color:var(--text); }
  .ev .t { color:var(--accent); width:58px; flex:none; }
  .ev .k { color:var(--text); }
  .dial-row { display:flex; gap:10px; align-items:center; }
  canvas#dial { background:#0c1015; border:1px solid var(--line); border-radius:6px; }
  .desc { color:var(--dim); font-size:11px; margin:0 0 8px; }
  .note { color:var(--dim); font-size:10px; margin-top:8px; }
  @media (max-width:900px) { .app { grid-template-columns:1fr; grid-template-rows:auto auto auto auto; height:auto; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Virtual Pool</h1>
    <span class="sub" id="subtitle"></span>
    <span class="tag" id="tag"></span>
  </header>

  <div class="stage">
    <div class="canvas-wrap"><canvas id="table" width="1280" height="680"></canvas></div>
    <div class="transport">
      <button id="play">pause</button>
      <button id="end" title="jump to the end">&#9197;</button>
      <select id="speed">
        <option value="0.1">0.1&times;</option>
        <option value="0.25">0.25&times;</option>
        <option value="0.5">0.5&times;</option>
        <option value="1">1&times;</option>
        <option value="2" selected>2&times;</option>
        <option value="4">4&times;</option>
        <option value="8">8&times;</option>
        <option value="16">16&times;</option>
      </select>
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="1000" value="0">
        <div class="ticks" id="ticks"></div>
      </div>
      <span id="clock" style="color:var(--dim);width:120px;text-align:right">t = 0.000 s</span>
    </div>
  </div>

  <aside>
    <div class="grp">
      <h2>shots</h2>
      <div class="shots" id="shots"></div>
      <p class="desc" id="description" style="margin-top:8px"></p>
    </div>
    <div class="grp">
      <h2>display</h2>
      <div class="toggles">
        <button id="t-trails" class="on">trails</button>
        <button id="t-vectors">velocity</button>
        <button id="t-overlay">overlay</button>
      </div>
      <div class="note">space plays and pauses &middot; &larr; and &rarr; step from event to event</div>
    </div>
    <div class="grp">
      <h2>cue ball</h2>
      <div class="dial-row">
        <canvas id="dial" width="120" height="120"></canvas>
        <div style="flex:1">
          <div class="read"><span>speed</span><b id="d-speed">0.00 m/s</b></div>
          <div class="read"><span>state</span><b id="d-state">&mdash;</b></div>
          <div class="read"><span>&omega;<sub>z</sub></span><b id="d-wz">0.0 rad/s</b></div>
          <div class="read"><span>&omega;<sub>y</sub></span><b id="d-wy">0.0 rad/s</b></div>
        </div>
      </div>
    </div>
    <div class="grp">
      <h2>balls</h2>
      <table class="balls">
        <thead><tr><th>ball</th><th style="text-align:right">speed</th><th style="text-align:right">state</th></tr></thead>
        <tbody id="ballrows"></tbody>
      </table>
    </div>
    <div class="grp">
      <h2>events</h2>
      <div class="evlog" id="evlog"></div>
    </div>
  </aside>
</div>

  if (dt < 0) dt = 0; else if (dt > span) dt = span;
  const h = 0.5 * dt * dt;
  return [ segment.p[0] + (segment.v[0]*dt + segment.a[0]*h),
           segment.p[1] + (segment.v[1]*dt + segment.a[1]*h),
           segment.p[2] + (segment.v[2]*dt + segment.a[2]*h) ];
}

function velocityAt(segment, t) {
  let dt = t - segment.t0;
  const span = segment.t1 - segment.t0;
  if (dt < 0) dt = 0; else if (dt > span) dt = span;
  return [ segment.v[0] + segment.a[0]*dt, segment.v[1] + segment.a[1]*dt, segment.v[2] + segment.a[2]*dt ];
}

function angularAt(segment, t) {
  let dt = t - segment.t0;
  const span = segment.t1 - segment.t0;
  if (dt < 0) dt = 0; else if (dt > span) dt = span;
  return [ segment.w[0] + segment.wa[0]*dt, segment.w[1] + segment.wa[1]*dt, segment.w[2] + segment.wa[2]*dt ];
}

/** The segment of a ball's path that covers the time `t`, or null. */
function segmentAt(segments, t) {
  let lo = 0, hi = segments.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (segments[mid].t0 <= t) lo = mid + 1; else hi = mid;
  }
  if (lo === 0) return null;
  const s = segments[lo - 1];
  return (t <= s.t1 + 1e-12) ? s : null;
}

/** The state of a ball at the time `t`, or null when it was out of play. */
function sampleBall(ball, t) {
  const s = segmentAt(ball.segments, t);
  if (!s) return null;
  return { p: positionAt(s, t), v: velocityAt(s, t), w: angularAt(s, t), kind: s.kind, pocket: s.pocket };
}

/* ----------------------------------------------------------------- layout */

function computeMetrics() {
  const pad = 0.075;
  const w = G.length + 2 * pad;
  const h = G.width + 2 * pad;
  // The contexts are scaled by the device pixel ratio, so the layout is in CSS
  // pixels and the scale is a CSS-pixel scale.
  const cssWidth = canvas.width / dpr;
  const cssHeight = canvas.height / dpr;
  const scale = Math.min(cssWidth / w, cssHeight / h);
  return { scale, ox: (cssWidth - w * scale) / 2, oy: (cssHeight - h * scale) / 2,
           cssWidth, cssHeight };
}
const TX = x => metrics.ox + x * metrics.scale;
const TY = y => metrics.oy + (G.width - y) * metrics.scale;

/* ------------------------------------------------------------------ table */

function drawTable() {
  const s = metrics.scale;
  tctx.clearRect(0, 0, tableCache.width, tableCache.height);
  tctx.fillStyle = "#12161c";
  tctx.fillRect(0, 0, tableCache.width, tableCache.height);

  // The slate: everything outside the bed.
  tctx.fillStyle = "#6b4f33";
  tctx.fillRect(TX(-0.075), TY(G.width + 0.075), (G.length + 0.15) * s, (G.width + 0.15) * s);
  tctx.fillStyle = "#5a4229";
  tctx.fillRect(TX(-0.075), TY(G.width + 0.075), (G.length + 0.15) * s, 0.02 * s);

  // The bed.
  const grad = tctx.createLinearGradient(0, TY(G.width), 0, TY(0));
  grad.addColorStop(0, "#226e4d");
  grad.addColorStop(1, "#17573c");
  tctx.fillStyle = grad;
  tctx.fillRect(TX(0), TY(G.width), G.length * s, G.width * s);

  // The pockets: the shelf behind the mouth line and the hole behind it.
  for (const p of G.pockets) {
    const tipA = p.jaws[0].tip, tipB = p.jaws[1].tip, throat = p.jaws[1].end;
    tctx.beginPath();
    tctx.moveTo(TX(tipA[0]), TY(tipA[1]));
    tctx.lineTo(TX(tipB[0]), TY(tipB[1]));
    tctx.lineTo(TX(throat[0]), TY(throat[1]));
    tctx.closePath();
    tctx.fillStyle = "#0c0f12";
    tctx.fill();
    const drop = [ p.mouth_centre[0] + p.centreline[0] * (p.shelf_depth + 0.02),
                   p.mouth_centre[1] + p.centreline[1] * (p.shelf_depth + 0.02) ];
    tctx.beginPath();
    tctx.arc(TX(drop[0]), TY(drop[1]), 0.055 * s, 0, Math.PI * 2);
    tctx.fillStyle = "#080a0c";
    tctx.fill();
  }

  // The cushion noses: a rubber band on the outside of every nose line.
  tctx.lineCap = "butt";
  for (const rail of G.rails) {
    for (const span of rail.spans) {
      const a = [ rail.normal[0] * rail.line + rail.tangent[0] * span[0],
                  rail.normal[1] * rail.line + rail.tangent[1] * span[0] ];
      const b = [ rail.normal[0] * rail.line + rail.tangent[0] * span[1],
                  rail.normal[1] * rail.line + rail.tangent[1] * span[1] ];
      tctx.beginPath();
      tctx.moveTo(TX(a[0]), TY(a[1]));
      tctx.lineTo(TX(b[0]), TY(b[1]));
      tctx.strokeStyle = "#1d6b4b";
      tctx.lineWidth = 0.05 * s;
      tctx.stroke();
      tctx.beginPath();
      tctx.moveTo(TX(a[0]), TY(a[1]));
      tctx.lineTo(TX(b[0]), TY(b[1]));
      tctx.strokeStyle = "#2c8f66";
      tctx.lineWidth = 0.016 * s;
      tctx.stroke();
    }
  }

  // The pocket facings: the jaws, drawn as rubber.
  tctx.strokeStyle = "#1d6b4b";
  tctx.lineWidth = 0.016 * s;
  for (const p of G.pockets) {
    for (const jaw of p.jaws) {
      tctx.beginPath();
      tctx.moveTo(TX(jaw.tip[0]), TY(jaw.tip[1]));
      tctx.lineTo(TX(jaw.end[0]), TY(jaw.end[1]));
      tctx.stroke();
    }
  }

  // The spots.
  tctx.fillStyle = "rgba(255,255,255,.13)";
  for (const spot of [[ G.length / 4, G.width / 2 ], [ G.length * 0.75, G.width / 2 ]]) {
    tctx.beginPath();
    tctx.arc(TX(spot[0]), TY(spot[1]), 0.008 * s, 0, Math.PI * 2);
    tctx.fill();
  }
}

/* ------------------------------------------------------------------ balls */

function drawBall(x, y, r, number, alpha, z) {
  const height = z || 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  const px = TX(x), py = TY(y), pr = r * metrics.scale * (1 - height * 1.1);
  // The shadow: it stays on the bed and it fades as the ball rises.
  ctx.globalAlpha = alpha * Math.max(0, 0.38 - height * 3.0);
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.ellipse(px + height * 14, py + height * 10, r * metrics.scale, r * metrics.scale * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(px - pr * 0.35, py - pr * 0.4, pr * 0.1, px, py, pr);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(0.22, COLORS[number]);
  g.addColorStop(1, "#000000");
  ctx.beginPath();
  ctx.arc(px, py, pr, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  if (number >= 9) {
    // The stripe of the nine ball and up.
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = "#f4f2e8";
    ctx.fillRect(px - pr, py - pr * 0.42, pr * 2, pr * 0.84);
    ctx.restore();
  }
  ctx.strokeStyle = "rgba(0,0,0,.55)";
  ctx.lineWidth = Math.max(1, pr * 0.06);
  ctx.beginPath();
  ctx.arc(px, py, pr, 0, Math.PI * 2);
  ctx.stroke();
  if (number !== 0) {
    ctx.fillStyle = (number === 8 || number > 8) ? "#f4f2e8" : "#14181d";
    ctx.font = (pr * 1.05).toFixed(1) + "px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(number), px, py);
  }
  ctx.restore();
}

/* ----------------------------------------------------------------- trails */

function trailFor(shot, ballIndex) {
  const key = shot.name + "#" + ballIndex;
  if (trailCache.has(key)) return trailCache.get(key);
  const segments = shot.balls[ballIndex].segments;
  const points = [];
  for (const s of segments) {
    const span = s.t1 - s.t0;
    const steps = Math.max(2, Math.min(30, Math.ceil(span * 90)));
    for (let i = 0; i <= steps; i++) {
      const t = s.t0 + span * i / steps;
      points.push({ t, p: positionAt(s, t) });
    }
  }
  trailCache.set(key, points);
  return points;
}

function drawTrail(points, until, colour, width, alpha) {
  if (points.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.lineJoin = "round";
  ctx.beginPath();
  let started = false;
  for (const pt of points) {
    if (pt.t > until) break;
    if (!started) { ctx.moveTo(TX(pt.p[0]), TY(pt.p[1])); started = true; }
    else ctx.lineTo(TX(pt.p[0]), TY(pt.p[1]));
  }
  ctx.stroke();
  ctx.restore();
}

/* ------------------------------------------------------------------ frame */

function drawFrame() {
  const shot = SHOTS[shotIndex];
  ctx.drawImage(tableCache, 0, 0, metrics.cssWidth, metrics.cssHeight);

  if (overlay) {
    // The path of every ball of every other shot, so the shots can be compared.
    SHOTS.forEach((other, index) => {
      if (index === shotIndex) return;
      other.balls.forEach((ball, ballIndex) => {
        drawTrail(trailFor(other, ballIndex), time, COLORS[ball.number] || "#8899aa", 1.1, 0.3);
      });
    });
  }

  if (showTrails) {
    shot.balls.forEach((ball, index) => {
      const colour = index === 0 ? "rgba(244,242,232,.5)" : COLORS[ball.number];
      drawTrail(trailFor(shot, index), time, colour || "#888", 1.4, index === 0 ? 0.75 : 0.4);
    });
  }

  const radius = G.ball_radius;
  shot.balls.forEach((ball, index) => {
    const state = sampleBall(ball, time);
    if (!state) return;
    if (state.pocket === "pocketed" || state.pocket === "off-table") return;
    drawBall(state.p[0], state.p[1], radius, ball.number, 1, state.p[2] - G.ball_radius);
    if (showVectors) {
      const speed = Math.hypot(state.v[0], state.v[1]);
      if (speed > 0.01) {
        const k = 0.08 / Math.max(speed, 0.4);
        ctx.strokeStyle = "rgba(78,161,255,.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(TX(state.p[0]), TY(state.p[1]));
        ctx.lineTo(TX(state.p[0] + state.v[0] * k), TY(state.p[1] + state.v[1] * k));
        ctx.stroke();
      }
    }
  });

  // The impact markers of the events that have happened.
  for (const ev of shot.events) {
    if (ev.t > time) break;
    const fade = Math.max(0, 1 - (time - ev.t) / 0.35);
    if (fade <= 0) continue;
    const colour = EVENT_COLOR[ev.kind] || "#ffffff";
    for (const idx of [ev.a, ev.b]) {
      const ball = shot.balls[idx];
      if (!ball) continue;
      const st = sampleBall(ball, ev.t);
      if (!st) continue;
      ctx.save();
      ctx.globalAlpha = fade * 0.9;
      ctx.strokeStyle = colour;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(TX(st.p[0]), TY(st.p[1]), radius * metrics.scale * 1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

/* ------------------------------------------------------------------- dial */

function drawDial(shot) {
  const w = dial.width, h = dial.height, cx = w / 2, cy = h / 2, r = w * 0.36;
  dctx.clearRect(0, 0, w, h);
  dctx.fillStyle = "#0c1015";
  dctx.fillRect(0, 0, w, h);
  const state = sampleBall(shot.balls[0], time);
  dctx.strokeStyle = "#2a3340";
  dctx.lineWidth = 1;
  dctx.beginPath();
  dctx.arc(cx, cy, r, 0, Math.PI * 2);
  dctx.stroke();

  const speed = state ? Math.hypot(state.v[0], state.v[1]) : 0;
  const wz = state ? state.w[2] : 0;
  const wy = state ? state.w[1] : 0;

  // The direction of travel.
  if (state && speed > 0.005) {
    const ux = state.v[0] / speed, uy = state.v[1] / speed;
    dctx.strokeStyle = "#7ee08a";
    dctx.lineWidth = 2;
    dctx.beginPath();
    dctx.moveTo(cx, cy);
    dctx.lineTo(cx + ux * r * 0.9, cy - uy * r * 0.9);
    dctx.stroke();
    dctx.beginPath();
    dctx.arc(cx + ux * r * 0.9, cy - uy * r * 0.9, 3, 0, Math.PI * 2);
    dctx.fillStyle = "#7ee08a";
    dctx.fill();
  }

  // The side spin: a curved arrow around the ball.
  if (Math.abs(wz) > 0.5) {
    const dir = wz > 0 ? 1 : -1;
    dctx.strokeStyle = "#ffd166";
    dctx.lineWidth = 2;
    dctx.beginPath();
    dctx.arc(cx, cy, r * 0.62, dir > 0 ? -0.6 : Math.PI - 0.6, dir > 0 ? Math.PI - 0.6 : Math.PI + 0.6, dir < 0);
    dctx.stroke();
    const a = dir > 0 ? Math.PI - 0.6 : Math.PI + 0.6;
    const ex = cx + Math.cos(a) * r * 0.62, ey = cy + Math.sin(a) * r * 0.62;
    dctx.fillStyle = "#ffd166";
    dctx.beginPath();
    dctx.arc(ex, ey, 3, 0, Math.PI * 2);
    dctx.fill();
  }

  // The top and bottom spin: a dot above or below the centre.
  if (Math.abs(wy) > 0.5) {
    dctx.fillStyle = "#4ea1ff";
    dctx.beginPath();
    dctx.arc(cx, cy + (wy > 0 ? -r * 0.55 : r * 0.55), 4, 0, Math.PI * 2);
    dctx.fill();
  }

  dctx.fillStyle = "#8a97a5";
  dctx.font = "10px ui-monospace, monospace";
  dctx.textAlign = "center";
  dctx.fillText(state ? state.kind : "-", cx, h - 6);
}

/* --------------------------------------------------------------- readouts */

function updateReadouts() {
  const shot = SHOTS[shotIndex];
  document.getElementById("clock").textContent = "t = " + time.toFixed(3) + " s";
  document.getElementById("scrub").value = String(shot.duration > 0 ? Math.round(time / shot.duration * 1000) : 0);

  let done = 0;
  for (const ev of shot.events) { if (ev.t <= time) done++; else break; }
  document.getElementById("d-speed").textContent = "0.00 m/s";
  document.getElementById("d-state").textContent = "—";
  document.getElementById("d-wz").textContent = "0.0 rad/s";
  document.getElementById("d-wy").textContent = "0.0 rad/s";

  const rows = [];
  shot.balls.forEach((ball, index) => {
    const st = sampleBall(ball, time);
    const speed = st ? Math.hypot(st.v[0], st.v[1]) : 0;
    const label = index === 0 ? "cue" : String(ball.number);
    const state = st ? (st.pocket === "pocketed" ? "pocketed" : st.pocket === "off-table" ? "off table" : st.kind) : "—";
    rows.push('<tr><td><span class="swatch" style="background:' + (COLORS[ball.number] || "#888") + '"></span>' +
              label + "</td><td class=\"n\">" + speed.toFixed(2) + "</td><td class=\"n\">" + state + "</td></tr>");
    if (index === 0 && st) {
      document.getElementById("d-speed").textContent = speed.toFixed(2) + " m/s";
      document.getElementById("d-state").textContent = st.kind;
      document.getElementById("d-wz").textContent = st.w[2].toFixed(1) + " rad/s";
      document.getElementById("d-wy").textContent = st.w[1].toFixed(1) + " rad/s";
    }
  });
  document.getElementById("ballrows").innerHTML = rows.join("");
  drawDial(shot);
}

/* --------------------------------------------------------------- controls */

function selectShot(index) {
  shotIndex = Math.max(0, Math.min(SHOTS.length - 1, index));
  time = 0;
  trailCache.clear();
  const buttons = document.querySelectorAll("#shots button");
  buttons.forEach((b, i) => b.classList.toggle("on", i === shotIndex));
  document.getElementById("description").textContent = SHOTS[shotIndex].description || "";
  buildTicks();
  buildEventLog();
}

function buildShots() {
  const host = document.getElementById("shots");
  host.innerHTML = "";
  SHOTS.forEach((shot, index) => {
    const b = document.createElement("button");
    b.innerHTML = shot.name + "<small>" + (shot.note || "") + "</small>";
    b.onclick = () => selectShot(index);
    host.appendChild(b);
  });
}

function buildTicks() {
  const shot = SHOTS[shotIndex];
  const host = document.getElementById("ticks");
  host.innerHTML = "";
  if (shot.duration <= 0) return;
  for (const ev of shot.events) {
    const tick = document.createElement("div");
    tick.className = "tick";
    tick.style.left = (ev.t / shot.duration * 100) + "%";
    tick.style.background = EVENT_COLOR[ev.kind] || "#ffffff";
    host.appendChild(tick);
  }
}

function buildEventLog() {
  const shot = SHOTS[shotIndex];
  const host = document.getElementById("evlog");
  host.innerHTML = shot.events.map((ev, i) =>
    '<div class="ev" data-i="' + i + '"><span class="t">' + ev.t.toFixed(3) + 's</span><span class="k">' +
    eventText(shot, ev) + "</span></div>").join("");
  host.querySelectorAll(".ev").forEach(row => {
    row.onclick = () => {
      time = SHOTS[shotIndex].events[Number(row.dataset.i)].t;
      playing = false;
      document.getElementById("play").textContent = "play";
    };
  });
}

/** What an event did, in words. The event carries ball *indices*, not numbers. */
function eventText(shot, ev) {
  const number = index => (shot.balls[index] ? shot.balls[index].number : index);
  const rail = index => (G.rails[index] ? G.rails[index].label : index);
  const pocket = index => (G.pockets[index] ? G.pockets[index].label : index);
  switch (ev.kind) {
    case "ball-ball": return "ball " + number(ev.a) + " hits ball " + number(ev.b);
    case "cushion": return "ball " + number(ev.a) + " on the " + rail(ev.b) + " rail";
    case "jaw": return "ball " + number(ev.a) + " on the " + pocket(ev.b) + " jaw";
    case "slate": return "ball " + number(ev.a) + " lands on the slate";
    case "state": return "ball " + number(ev.a) + " changes its motion";
    case "pocket-enter": return "ball " + number(ev.a) + " enters the " + pocket(ev.b);
    case "pocket-drop": return "ball " + number(ev.a) + " drops in the " + pocket(ev.b);
    case "pocket-exit": return "ball " + number(ev.a) + " rattles out of the " + pocket(ev.b);
    case "off-table": return "ball " + number(ev.a) + " leaves the table";
    default: return ev.kind;
  }
}

document.getElementById("play").onclick = () => {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "pause" : "play";
};
document.getElementById("end").onclick = () => {
  time = SHOTS[shotIndex].duration;
  playing = false;
  document.getElementById("play").textContent = "play";
};
document.getElementById("speed").onchange = e => { speed = Number(e.target.value); };
document.getElementById("scrub").oninput = e => {
  time = Number(e.target.value) / 1000 * SHOTS[shotIndex].duration;
};
document.getElementById("t-trails").onclick = e => {
  showTrails = !showTrails;
  e.target.classList.toggle("on", showTrails);
};
document.getElementById("t-vectors").onclick = e => {
  showVectors = !showVectors;
  e.target.classList.toggle("on", showVectors);
};
document.getElementById("t-overlay").onclick = e => {
  overlay = !overlay;
  e.target.classList.toggle("on", overlay);
};
window.addEventListener("keydown", e => {
  const shot = SHOTS[shotIndex];
  if (e.code === "Space") {
    e.preventDefault();
    document.getElementById("play").click();
  } else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    e.preventDefault();
    const forward = e.code === "ArrowRight";
    const times = shot.events.map(ev => ev.t);
    let next = forward ? times.find(t => t > time + 1e-9) : [...times].reverse().find(t => t < time - 1e-9);
    time = next === undefined ? (forward ? shot.duration : 0) : next;
    playing = false;
    document.getElementById("play").textContent = "play";
  }
});

/* ------------------------------------------------------------------ loop */

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const wrap = canvas.parentElement;
  const width = Math.max(320, wrap.clientWidth);
  const height = Math.max(240, Math.floor(width * (G.width + 0.15) / (G.length + 0.15)));
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tableCache.width = canvas.width;
  tableCache.height = canvas.height;
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  metrics = computeMetrics();
  drawTable();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const shot = SHOTS[shotIndex];
  if (playing) {
    time += dt * speed;
    if (time >= shot.duration) { time = shot.duration; playing = false; document.getElementById("play").textContent = "play"; }
  }
  drawFrame();
  updateReadouts();
  requestAnimationFrame(loop);
}

buildShots();
selectShot(0);
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
